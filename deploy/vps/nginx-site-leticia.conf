# Site principal advogadaleticiabarros.com.br (migrado da Hostinger em 16/11/2026)
# Regras traduzidas do .htaccess antigo. HTTPS: certbot --nginx -d advogadaleticiabarros.com.br -d www.advogadaleticiabarros.com.br
server {
    listen 80;
    listen [::]:80;
    server_name advogadaleticiabarros.com.br www.advogadaleticiabarros.com.br;

    root /var/www/advogadaleticiabarros.com.br;
    index index.html;
    charset utf-8;

    if ($host = www.advogadaleticiabarros.com.br) {
        return 301 https://advogadaleticiabarros.com.br$request_uri;
    }

    # arquivos ocultos (.git, .htaccess, .claude) fora do ar, menos .well-known
    location ~ /\.(?!well-known) { return 404; }

    # redirecionamentos do .htaccess
    location = /blog/ex-nao-paga-pensao-o-que-fazer.html { return 301 https://advogadaleticiabarros.com.br/blog/pai-nao-paga-pensao-o-que-fazer.html; }
    location = /blog/bpc-para-crianca-com-deficiencia-o-beneficio-de-r-1-621-que-muita-mae-nao-conhece.html { return 301 https://advogadaleticiabarros.com.br/blog/bpc-para-crianca-com-necessidades-especiais-o-beneficio-de-r-1-621-que-muita-mae-nao-conhece.html; }
    location = /voto { return 302 "https://advogadaleticiabarros.com.br/lp/demissao-por-voto.html?utm_source=instagram&utm_medium=stories&utm_campaign=assedio-eleitoral-2026"; }

    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json application/xml text/xml image/svg+xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=600, must-revalidate";
    }
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2|woff|gif|avif)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(css|js)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }
}
