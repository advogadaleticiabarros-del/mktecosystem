# Copiar para /etc/nginx/sites-available/orbit-api na VPS, depois:
#   ln -s /etc/nginx/sites-available/orbit-api /etc/nginx/sites-enabled/orbit-api
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d api.orbit.advogadaleticiabarros.com.br
server {
    listen 80;
    server_name api.orbit.advogadaleticiabarros.com.br;

    # verificação de domínio (TikTok for Developers e afins): arquivos estáticos em /var/www/orbit-verificacao
    location ~ ^/tiktok[A-Za-z0-9]+\.txt$ {
        root /var/www/orbit-verificacao;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
