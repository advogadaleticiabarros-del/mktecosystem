# Copiar para /etc/nginx/sites-available/orbit-web na VPS, depois:
#   ln -s /etc/nginx/sites-available/orbit-web /etc/nginx/sites-enabled/orbit-web
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d orbit.advogadaleticiabarros.com.br
server {
    listen 80;
    server_name orbit.advogadaleticiabarros.com.br;

    root /var/www/orbit-web;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
