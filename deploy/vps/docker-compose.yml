services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: orbit
    volumes:
      - orbit_pgdata:/var/lib/postgresql/data
    networks: [orbit]

  api:
    build:
      context: ../../apps/api
    restart: unless-stopped
    env_file: .env
    depends_on: [db]
    ports:
      - "127.0.0.1:8010:8000"
    networks: [orbit]

networks:
  orbit:

volumes:
  orbit_pgdata:
