<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; }
  .pill {
    width: 620px; height: 108px;
    display: inline-flex; align-items: center; gap: 16px;
    background: rgba(35, 30, 26, 0.72);
    border: 1px solid rgba(201, 169, 98, 0.55);
    border-radius: 999px;
    padding: 10px 24px 10px 10px;
    font-family: 'Inter', sans-serif;
  }
  .avatar {
    width: 84px; height: 84px; border-radius: 50%;
    object-fit: cover; object-position: 50% 22%;
    border: 2px solid #C9A962;
    flex-shrink: 0;
  }
  .texto { display: flex; flex-direction: column; }
  .handle { display: flex; align-items: center; gap: 6px; color: #E8DED1; font-weight: 700; font-size: 26px; }
  .verificado {
    width: 20px; height: 20px; border-radius: 50%;
    background: #3897F0; color: white; font-size: 13px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
  }
  .sub { color: #C9A962; font-size: 17px; font-weight: 600; margin-top: 2px; }
</style>
</head>
<body>
  <div class="pill">
    <img class="avatar" src="{{ avatar_src }}" alt="">
    <div class="texto">
      <span class="handle">adv.leticiabarros2 <span class="verificado">&#10003;</span></span>
      <span class="sub">Advogada | OAB/ES 39.948</span>
    </div>
  </div>
</body>
</html>
