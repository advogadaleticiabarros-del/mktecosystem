<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Editor de artes</title>
<link href="/web/fontes.css" rel="stylesheet">
<link href="/web/editor.css" rel="stylesheet">
<script src="/web/peca.js"></script></head>
<body>
<header>
  <label class="titulo">Peça <select id="peca"></select></label>
  <button id="desfazer" title="Ctrl+Z">Desfazer</button>
  <button id="refazer" title="Ctrl+Y">Refazer</button>
  <span class="respiro"></span>
  <span id="situacao" role="status">Salvo</span>
  <button id="nova-versao">Nova versão</button>
  <button id="voltar-original">Voltar ao original</button>
  <button id="baixar" class="principal">Baixar imagem</button>
</header>
<main>
  <section id="palco-area">
    <div id="palco-escala"><div id="palco"></div></div>
    <div id="selecao" hidden><div id="alca" title="Arraste para aumentar ou diminuir"></div></div>
    <div id="molduras"></div>
    <div id="laco" hidden></div>
    <div id="guia-x" class="guia" hidden></div>
    <div id="guia-y" class="guia" hidden></div>
  </section>
  <aside>
    <div class="acoes">
      <button id="novo-texto">+ Texto</button>
      <button id="nova-foto">+ Foto</button>
      <button id="novo-fio">+ Fio</button>
      <button id="nova-luz">+ Luz</button>
    </div>
    <div id="aviso" role="alert" hidden></div>
    <div id="painel"></div>
    <h2>Camadas</h2>
    <p class="dica">A de cima fica na frente. Arraste uma linha para mudar a ordem.</p>
    <div id="camadas"></div>
  </aside>
</main>
<div id="menu" hidden></div>
<input id="arquivo-foto" type="file" accept="image/*" hidden>
<script src="/web/editor.js"></script>
</body></html>
