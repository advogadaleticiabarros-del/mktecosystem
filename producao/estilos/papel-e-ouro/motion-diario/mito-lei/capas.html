<!doctype html><html lang=pt-BR><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Capas Mito ou Lei</title>
<link rel=stylesheet href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4EEE5;--card:#FFFDF9;--fg:#1E1814;--mute:#6B5D4E;--linha:#E2D7C7;--ouro:#8A6A24}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1E1814;--card:#2A231E;--fg:#EFE6D9;--mute:#B8AC9C;--linha:#3E352D;--ouro:#D8B566}}
:root[data-theme="dark"]{--bg:#1E1814;--card:#2A231E;--fg:#EFE6D9;--mute:#B8AC9C;--linha:#3E352D;--ouro:#D8B566}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.5 Inter,system-ui,sans-serif}
main{max-width:1180px;margin:0 auto;padding:36px 16px 80px}h1{font:500 40px/1.1 'EB Garamond',Georgia,serif;margin:0 0 8px}
.intro{color:var(--mute);max-width:70ch;margin:0 0 18px}
.modo{display:inline-flex;border:1px solid var(--linha);border-radius:999px;overflow:hidden;margin-bottom:24px}
.modo button{font:500 14px Inter;padding:8px 16px;border:0;background:transparent;color:var(--fg);cursor:pointer}
.modo button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:22px 16px}
figure{margin:0}img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:8px;display:block;background:var(--card);box-shadow:0 1px 3px rgb(0 0 0/.12)}
body.g34 img{aspect-ratio:3/4}body.g34 .grade{gap:4px;grid-template-columns:repeat(3,1fr);max-width:720px}body.g34 figcaption{display:none}body.g34 img{border-radius:0}
figcaption{padding-top:8px;font-size:13px}figcaption b{display:block;color:var(--ouro);font-weight:600}figcaption span{color:var(--mute)}
</style></head><body><main>
<h1>Capas · Mito ou Lei</h1>
<p class=intro>As 27 capas no estilo Moldura Viva, na ordem em que os Reels vão ao ar (seg, qua e sáb às 19h). Use "Como na grade" para ver o recorte 3:4 que aparece no perfil, três por linha.</p>
<div class=modo role=group><button id=b1 aria-pressed=true>Capa inteira</button><button id=b2 aria-pressed=false>Como na grade</button></div>

ure><img src="capas/11-30-13-salario-2026.jpg" alt="Capa: Hoje vence a 1ª parcela do 13º." loading="lazy"><figcaption><b>09 · seg 30/11 · 19h</b><span>Hoje vence a 1ª parcela do 13º.</span></figcaption></figure><figure><img src="capas/12-02-guarda-natal-ferias.jpg" alt="Capa: Quem paga pensão pode levar o filho quando quiser." loading="lazy"><figcaption><b>10 · qua 02/12 · 19h</b><span>Quem paga pensão pode levar o filho quando quiser.</span></figcaption></figure><figure><img src="capas/12-04-hiv-trabalho.jpg" alt="Capa: Quem vive com HIV precisa contar para a empresa." loading="lazy"><figcaption><b>11 · sáb 05/12 · 19h</b><span>Quem vive com HIV precisa contar para a empresa.</span></figcaption></figure><figure><img src="capas/12-06-trabalho-escravo.jpg" alt="Capa: Empresa com 100 funcionários precisa ter cota de inclusão." loading="lazy"><figcaption><b>12 · seg 07/12 · 19h</b><span>Empresa com 100 funcionários precisa ter cota de inclusão.</span></figcaption></figure><figure><img src="capas/12-08-burnout-trabalho.jpg" alt="Capa: Burnout não é doença do trabalho." loading="lazy"><figcaption><b>13 · qua 09/12 · 19h</b><span>Burnout não é doença do trabalho.</span></figcaption></figure><figure><img src="capas/12-12-festa-da-firma.jpg" alt="Capa: Assédio sexual no trabalho é crime." loading="lazy"><figcaption><b>14 · sáb 12/12 · 19h</b><span>Assédio sexual no trabalho é crime.</span></figcaption></figure><figure><img src="capas/12-14-13-segunda-parcela.jpg" alt="Capa: A 2ª parcela do 13º vem sem descontos." loading="lazy"><figcaption><b>15 · seg 14/12 · 19h</b><span>A 2ª parcela do 13º vem sem descontos.</span></figcaption></figure><figure><img src="capas/12-18-13-segunda-parcela.jpg" alt="Capa: A 2ª parcela do 13º tem que cair até sexta, 18/12." loading="lazy"><figcaption><b>16 · qua 16/12 · 19h</b><span>A 2ª parcela do 13º tem que cair até sexta, 18/12.</span></figcaption></figure><figure><img src="capas/12-20-temporaria-fim-de-ano.jpg" alt="Capa: Temporário de fim de ano não tem FGTS." loading="lazy"><figcaption><b>17 · sáb 19/12 · 19h</b><span>Temporário de fim de ano não tem FGTS.</span></figcaption></figure><figure><img src="capas/12-22-natal-ano-novo-feriado.jpg" alt="Capa: 24 e 31 de dezembro são feriados nacionais." loading="lazy"><figcaption><b>18 · seg 21/12 · 19h</b><span>24 e 31 de dezembro são feriados nacionais.</span></figcaption></figure><figure><img src="capas/12-24-viagem-com-filhos.jpg" alt="Capa: Viajar com o filho no Brasil sempre exige autorização do outro genitor." loading="lazy"><figcaption><b>19 · qua 23/12 · 19h</b><span>Viajar com o filho no Brasil sempre exige autorização do outro genitor.</span></figcaption></figure><figure><img src="capas/12-26-pensao-reajuste.jpg" alt="Capa: Pensão em salário mínimo aumenta sozinha em janeiro." loading="lazy"><figcaption><b>20 · sáb 26/12 · 19h</b><span>Pensão em salário mínimo aumenta sozinha em janeiro.</span></figcaption></figure><figure><img src="capas/12-28-natal-ano-novo-feriado.jpg" alt="Capa: Os prazos do processo trabalhista param no fim do ano." loading="lazy"><figcaption><b>21 · seg 28/12 · 19h</b><span>Os prazos do processo trabalhista param no fim do ano.</span></figcaption></figure><figure><img src="capas/12-30-ferias-coletivas.jpg" alt="Capa: Férias coletivas podem ser divididas em 3 partes." loading="lazy"><figcaption><b>22 · qua 30/12 · 19h</b><span>Férias coletivas podem ser divididas em 3 partes.</span></figcaption></figure><figure><img src="capas/12-10-assedio-moral.jpg" alt="Capa: Gritar com funcionário na frente de todos é só jeito do chefe." loading="lazy"><figcaption><b>23 · sáb 02/01 · 19h</b><span>Gritar com funcionário na frente de todos é só jeito do chefe.</span></figcaption></figure><figure><img src="capas/11-28-dona-de-casa-inss.jpg" alt="Capa: Aposentada perde a pensão por morte." loading="lazy"><figcaption><b>24 · seg 04/01 · 19h</b><span>Aposentada perde a pensão por morte.</span></figcaption></figure><figure><img src="capas/12-16-aposentadoria-2027.jpg" alt="Capa: BPC dá direito a 13º." loading="lazy"><figcaption><b>25 · qui 07/01 · 19h</b><span>BPC dá direito a 13º.</span></figcaption></figure><figure><img src="capas/11-10-amamentacao-trabalho.jpg" alt="Capa: Grávida com estabilidade pode pedir demissão sozinha." loading="lazy"><figcaption><b>26 · sáb 09/01 · 19h</b><span>Grávida com estabilidade pode pedir demissão sozinha.</span></figcaption></figure><figure><img src="capas/11-24-aposentadoria-mulher-2026.jpg" alt="Capa: Quem nunca contribuiu não recebe nada do INSS." loading="lazy"><figcaption><b>27 · seg 11/01 · 19h</b><span>Quem nunca contribuiu não recebe nada do INSS.</span></figcaption></figure></div></main>
<script>const b1=document.getElementById('b1'),b2=document.getElementById('b2');
function set(g){document.body.classList.toggle('g34',g);b1.setAttribute('aria-pressed',!g);b2.setAttribute('aria-pressed',g)}
b1.onclick=()=>set(false);b2.onclick=()=>set(true);</script></body></html>
