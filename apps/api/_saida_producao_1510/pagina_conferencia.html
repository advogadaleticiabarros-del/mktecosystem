<title>Conferência dos criativos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: lista de revisão — cada peça com a arte à esquerda e o texto completo à direita; empilha no celular. */
:root{--papel:#F3ECE1;--folha:#FFFDF8;--tinta:#1E1814;--cinza:#6B5D4E;--fio:#E0D3BF;--ouro:#8A6420;
--serif:'EB Garamond',Georgia,serif;--sans:Inter,system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--papel:#1C1713;--folha:#26201B;--tinta:#EFE6D9;--cinza:#B8AC9C;--fio:#3E352D;--ouro:#D8B566;color-scheme:dark}}
:root[data-theme="dark"]{--papel:#1C1713;--folha:#26201B;--tinta:#EFE6D9;--cinza:#B8AC9C;--fio:#3E352D;--ouro:#D8B566;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--papel);color:var(--tinta);font:400 15px/1.55 var(--sans);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:980px;margin:0 auto;padding-block:36px 80px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,6vw,52px);line-height:1.05}
h2{font-size:30px;margin-top:44px;padding-bottom:6px;border-bottom:2px solid var(--ouro)}
h3{font-size:22px;line-height:1.2;margin-top:2px}
.olho{font:600 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ouro)}
.lead,.exp{color:var(--cinza);max-width:66ch}
.indice{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.indice a{color:var(--tinta);text-decoration:none;border:1px solid var(--fio);border-radius:999px;padding:6px 14px;background:var(--folha)}
.indice a:focus-visible,.vid:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.indice b{color:var(--ouro);margin-left:4px}
.c{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:20px;padding:20px 0;border-bottom:1px solid var(--fio)}
figure{margin:0;display:grid;gap:8px;align-content:start}
figure img{width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border:1px solid var(--fio)}
.tira{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.tira img{aspect-ratio:4/5;border:0}
.vid{color:var(--ouro);font-weight:600;text-decoration:none}
.meta{margin:0;color:var(--cinza);font-size:13px;font-variant-numeric:tabular-nums}
details{margin-top:10px}summary{cursor:pointer;font:600 12px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ouro)}
pre{white-space:pre-wrap;word-break:break-word;font:400 14px/1.55 var(--sans);margin:6px 0 0;background:var(--folha);padding:12px 14px;border-left:3px solid var(--fio)}
@media (max-width:640px){.c{grid-template-columns:1fr}figure img{max-width:320px}}
</style>
<main>
<span class=olho>Conferência · {{TOTAL}} peças</span>
<h1>Conferência dos criativos</h1>
<p class=lead>Cada peça com a arte, o dia e a hora em que vai sair, a legenda e o primeiro comentário. Se algo precisar mudar, deixe um comentário na peça (botão de comentários da página) ou me diga a data.</p>
<nav class=indice>{{INDICE}}</nav>
{{CORPO}}
</main>
