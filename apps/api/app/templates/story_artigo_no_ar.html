<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }

  .story {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    font-family: 'Inter', sans-serif;
    color: {{ areia }};
    background: linear-gradient(160deg, {{ fundo }} 0%, {{ fundo }} 100%);
  }

  .story::before {
    content: '';
    position: absolute;
    inset: 40px;
    border: 1.5px solid {{ dourado }}8c;
    border-radius: 22px;
    pointer-events: none;
    z-index: 5;
  }

  .foto-wrap {
    position: relative;
    width: 100%;
    height: 920px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .foto-wrap img {
    width: 100%; height: 100%; object-fit: cover; object-position: center 30%;
    display: block;
  }
  .foto-wrap::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 55%, {{ fundo }} 100%);
  }

  .selo-novo {
    position: absolute;
    top: 96px; left: 96px;
    z-index: 4;
    background: {{ dourado }};
    color: {{ fundo }};
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 12px 30px;
    border-radius: 999px;
  }

  .conteudo {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 24px 88px 80px;
  }

  .categoria {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 26px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: {{ dourado }};
    margin-bottom: 28px;
  }

  .titulo {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: {{ tamanho_titulo }}px;
    line-height: 1.28;
    max-width: 880px;
    margin-bottom: 40px;
  }

  .resumo {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 32px;
    line-height: 1.5;
    color: {{ areia }}c7;
    max-width: 820px;
    margin-bottom: auto;
  }

  .cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    margin-top: 56px;
  }
  .cta-texto {
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 38px;
    color: {{ dourado }};
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .cta-seta {
    font-size: 42px;
    line-height: 1;
  }
  .assinatura {
    display: flex; align-items: center; gap: 16px;
    margin-top: 44px;
  }
  .assinatura img { width: 56px; height: 56px; object-fit: contain; }
  .assinatura .nome { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; }
  .assinatura .oab { font-size: 15px; letter-spacing: 1.5px; text-transform: uppercase; color: {{ dourado }}; display: block; }
</style>
</head>
<body>
  <div class="story">
    <div class="foto-wrap">
      <img src="{{ foto_src }}" alt="{{ titulo }}">
      <span class="selo-novo">Novo</span>
    </div>
    <div class="conteudo">
      <span class="categoria">{{ categoria }}</span>
      <h1 class="titulo">{{ titulo }}</h1>
      <p class="resumo">{{ resumo }}</p>
      <div class="cta">
        <span class="cta-texto">Matéria no ar <span class="cta-seta">&#8599;</span></span>
        <div class="assinatura">
          <img src="{{ logo_src }}" alt="{{ nome_conta }}">
          <div>
            <span class="nome">{{ nome_conta }}</span>
            <span class="oab">{{ oab }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
