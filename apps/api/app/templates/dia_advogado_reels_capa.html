<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }

  .card {
    width: 1080px; height: 1920px;
    position: relative; overflow: hidden;
    font-family: 'Inter', sans-serif;
    color: {{ areia }};
    background: {{ fundo }};
  }

  .bg-foto {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; object-position: center 22%;
    z-index: 0;
    filter: grayscale(.25) brightness(.55) sepia(.25) saturate(1.15);
  }
  .bg-escurecer {
    position: absolute; inset: 0; z-index: 1;
    background:
      linear-gradient(180deg, {{ fundo }}b3 0%, {{ fundo }}33 20%, {{ fundo }}59 39%, {{ fundo }}66 78%, {{ fundo }}f5 92%),
      linear-gradient(90deg, {{ fundo }}e6 0%, transparent 40%, transparent 100%);
  }

  .card::before {
    content: '';
    position: absolute;
    inset: 36px;
    border: 1.5px solid {{ dourado }}8c;
    border-radius: 18px;
    pointer-events: none;
    z-index: 4;
  }

  .foto-pessoa {
    position: absolute; z-index: 2;
    right: -260px; bottom: 260px;
    height: 1180px;
    filter: drop-shadow(-30px 20px 50px rgba(0,0,0,.55));
  }

  .top {
    position: absolute; top: 96px; left: 88px; right: 88px; z-index: 5;
    display: flex; align-items: center; gap: 16px;
  }
  .top img { width: 56px; height: 56px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,.45)); }
  .top .nm { font-family: 'Playfair Display', serif; font-size: 26px; font-weight: 700; line-height: 1.1; }
  .top .sb { font-size: 11px; letter-spacing: 3px; text-transform: uppercase; color: {{ dourado }}; margin-top: 3px; }

  .content {
    position: absolute; z-index: 3;
    left: 88px; right: 260px; top: 760px;
  }

  .kicker {
    font-size: 24px; font-weight: 700; letter-spacing: 5px; text-transform: uppercase;
    color: {{ areia }};
  }
  .kicker em { color: {{ dourado }}; font-style: normal; }

  .titulo {
    font-family: 'Playfair Display', serif;
    font-weight: 900;
    font-size: 92px;
    line-height: .96;
    text-transform: uppercase;
    margin-top: 4px;
  }

  .script {
    font-family: 'Great Vibes', cursive;
    font-size: 110px;
    color: {{ dourado }};
    line-height: 1;
    margin: 0 0 22px -6px;
  }

  .impacto {
    font-family: 'Playfair Display', serif;
    font-weight: 700;
    font-style: italic;
    font-size: 32px;
    line-height: 1.3;
    color: {{ areia }};
    max-width: 560px;
    margin-bottom: 18px;
  }

  .apoio {
    font-size: 22px; line-height: 1.48; font-weight: 500;
    color: {{ areia }}cc;
    max-width: 540px;
  }
  .apoio strong { color: {{ dourado }}; font-weight: 700; }

  .footer {
    position: absolute; z-index: 5; left: 88px; bottom: 130px;
    display: flex; align-items: center; gap: 16px;
  }
  .footer img { width: 44px; height: 44px; object-fit: contain; }
  .footer .handle { font-size: 17px; font-weight: 600; color: {{ areia }}b3; }
  .footer .oab { font-size: 12px; letter-spacing: 2px; color: {{ dourado }}; margin-top: 2px; }
</style>
</head>
<body>
  <div class="card">
    <img class="bg-foto" src="{{ fundo_src }}" alt="">
    <div class="bg-escurecer"></div>

    <img class="foto-pessoa" src="{{ pessoa_src }}" alt="">

    <div class="top">
      <img src="{{ logo_src }}" alt="{{ nome_conta }}">
      <div>
        <div class="nm">{{ nome_conta }}</div>
        <div class="sb">Advocacia</div>
      </div>
    </div>

    <div class="content">
      <div class="kicker">{{ kicker|safe }}</div>
      <div class="titulo">{{ titulo }}</div>
      <div class="script">{{ script }}</div>
      {% if impacto %}<p class="impacto">{{ impacto|safe }}</p>{% endif %}
      <p class="apoio">{{ apoio|safe }}</p>
    </div>

    <div class="footer">
      <img src="{{ logo_src }}" alt="{{ nome_conta }}">
      <div>
        <div class="handle">{{ instagram }}</div>
        <div class="oab">{{ oab }}</div>
      </div>
    </div>
  </div>
</body>
</html>
