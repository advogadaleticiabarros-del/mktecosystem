<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Playfair+Display:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { font-variant-numeric: lining-nums; font-feature-settings: "lnum" 1; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { margin: 0; }

  .card {
    width: 1080px; height: 1350px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column; justify-content: center;
    padding: 140px 104px;
    font-family: 'Inter', sans-serif;
    color: {{ areia }};
    background:
      radial-gradient(circle at 85% 10%, {{ dourado }}29, transparent 42%),
      radial-gradient(circle at 10% 92%, {{ dourado }}1f, transparent 46%),
      linear-gradient(160deg, {{ fundo }} 0%, {{ fundo }} 100%);
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 36px;
    border: 1.5px solid {{ dourado }}8c;
    border-radius: 18px;
    pointer-events: none;
  }

  .rotulo {
    align-self: flex-start;
    font-size: 22px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
    color: {{ fundo }};
    background: {{ dourado }};
    padding: 12px 26px;
    border-radius: 999px;
    margin-bottom: 56px;
  }

  .balao {
    position: relative;
    background: {{ areia }}14;
    border: 1.5px solid {{ dourado }}66;
    border-radius: 36px 36px 36px 8px;
    padding: 64px 64px 72px;
  }
  .balao .aspas {
    position: absolute; top: -70px; left: 40px;
    font-family: 'Playfair Display', serif; font-size: 170px; line-height: 1;
    color: {{ dourado }};
  }
  .pergunta {
    font-family: 'Playfair Display', serif;
    font-weight: 800;
    font-size: {{ tamanho_fonte }}px;
    line-height: 1.28;
  }

  .resposta {
    margin-top: 56px;
    font-size: 28px; font-weight: 600;
    color: {{ dourado }};
    letter-spacing: 1px;
  }

  .assinatura {
    position: absolute; left: 104px; right: 104px; bottom: 96px;
    display: flex; align-items: center; gap: 18px;
  }
  .assinatura img { width: 56px; height: 56px; object-fit: contain; }
  .assinatura .nome { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; }
  .assinatura .oab { font-size: 14px; letter-spacing: 2px; text-transform: uppercase; color: {{ dourado }}; }
</style>
</head>
<body>
  <div class="card">
    <span class="rotulo">{{ rotulo }}</span>
    <div class="balao">
      <span class="aspas">&ldquo;</span>
      <p class="pergunta">{{ pergunta }}</p>
    </div>
    <p class="resposta">A resposta está na legenda &rarr;</p>
    <div class="assinatura">
      <img src="{{ logo_src }}" alt="{{ nome_conta }}">
      <div>
        <div class="nome">{{ nome_conta }}</div>
        <div class="oab">{{ oab }}</div>
      </div>
    </div>
  </div>
</body>
</html>
